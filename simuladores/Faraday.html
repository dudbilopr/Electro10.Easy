<style>

:root{--panel-w:400px;--accent:var(--e10-primary)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 14px;border:1px solid var(--e10-line);border-radius:var(--e10-radius-sm);background:var(--e10-surface);color:var(--e10-ink);cursor:pointer;font:500 var(--e10-text-sm)/1 var(--e10-font-body);white-space:nowrap;transition:border-color .15s,background .15s}

.btn-primary:hover{background:var(--e10-primary-hover);border-color:var(--e10-primary-hover)}
.btn-icon{width:40px;padding:0}

.seg .btn{min-height:34px;border:0;background:transparent;color:var(--e10-muted)}

.h-menu{flex-shrink:0;display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--e10-surface);border-bottom:1px solid var(--e10-line);z-index:90;flex-wrap:wrap}

.e10-step[data-s="done"] .e10-step__n{background:var(--e10-success);color:#fff}

#pred-hint{font-size:var(--e10-text-xs);color:var(--e10-muted)}
.ans{display:grid;gap:4px;font-size:var(--e10-text-xs);color:var(--e10-muted)}
.ans input{background:var(--e10-surface);border:1px solid var(--e10-line);color:var(--e10-ink);min-height:38px;padding:6px 10px;border-radius:var(--e10-radius-sm);width:100%;font:500 var(--e10-text-sm) var(--e10-font-mono);outline:none}
.ans input:focus{border-color:var(--e10-primary);box-shadow:var(--e10-focus)}

.vrow{display:flex;align-items:center;gap:8px;padding:9px 12px;border-top:1px solid var(--e10-line)}
.vrow:first-child{border-top:0}
.vrow .e10-chip{margin-left:auto}
#check-hint{font-size:var(--e10-text-xs);color:var(--e10-muted)}

#explain{line-height:1.5}

#solution{padding:12px;border-radius:var(--e10-radius-md);background:var(--e10-bg);overflow-x:auto;line-height:1.6}
#solution .katex-display{margin:.4em 0}
.panel-progress{display:flex;align-items:center;gap:10px;padding:12px 18px;border-top:1px solid var(--e10-line)}
.panel-progress .e10-progress{flex:1}
.section-title{font:500 11px/1.4 var(--e10-font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--e10-muted)}
footer{flex-shrink:0;background:var(--e10-surface);border-top:1px solid var(--e10-line);padding:8px 16px;font-size:var(--e10-text-xs);color:var(--e10-muted);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
footer a{color:var(--e10-primary);text-decoration:none;font-weight:600}

@media (max-width:900px){
  header.e10-header{padding:8px 10px;min-height:56px;flex-wrap:wrap}
  header .e10-brand{font-size:1rem}

  .scene-tabs{order:5;margin:0;width:100%}
  .header-actions .btn{min-height:38px;padding:0 10px}

  .slide-panel:not(.open){max-height:150px}
  .sheet-handle{display:flex;justify-content:center;padding:8px 0 2px;border:0;background:none;cursor:pointer;width:100%}

  .panel-scroll{padding:8px 16px 16px}
  .panel-progress{display:none}
  #e10-live{bottom:22px;left:10px;right:10px;padding:6px 10px;gap:10px;min-height:44px}
  #e10-live .e10-eyebrow{display:none}
  #e10-live .katex{font-size:.95em}
  #values-body{min-width:220px}
  #coords-indicator{display:none}
  footer{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

const IM = { m: 1.0, a: 0.02, N: 100, v: 0.5, z: 0.03, dir: 'acerca', pole: 'N', reto: null };

      for (let k = 0; k < 4; k++) { const [a1, b1] = pts[k], [a2, b2] = pts[(k + 1) % 4], f = (ph + 0.5) % 1, sx0 = s > 0 ? a1 + (a2 - a1) * f : a2 + (a1 - a2) * f, sy0 = s > 0 ? b1 + (b2 - b1) * f : b2 + (b1 - b2) * f, ux = (s > 0 ? a2 - a1 : a1 - a2), uy = (s > 0 ? b2 - b1 : b1 - b2), L = Math.hypot(ux, uy) || 1; arrow(sx0 - ux / L * 10, sy0 - uy / L * 10, sx0 + ux / L * 10, sy0 + uy / L * 10, COL.accent, 3, 10); }
      arrow(xb, (yT + yB) / 2 + 30, xb - BA.dir * 50, (yT + yB) / 2 + 30, COL.force, 3.5, 12); text('F = ILB', xb - BA.dir * 56, (yT + yB) / 2 + 48, COL.force, 12, BA.dir > 0 ? 'right' : 'left', 600);
      bigSym((xR + xb) / 2, (yT + yB) / 2, real === 'cw' ? -1 : 1, COL.accentStrong, 'B inducido');
    }
    text('Vista de frente · los rieles se unen por la resistencia R', 16, HU - 12, COL.muted, 12);
    const pl = wide ? { x: W * 0.6, y: 20, w: W * 0.4 - 20, h: Math.min(HU - 40, 320) } : null; if (!pl) return;
    plotAxes(pl, 'Si se suelta la barra: rapidez en el tiempo');
    if (!rv) { hint(pl, 'Comprueba tu predicción para ver el balance.'); return; }
    const T = baTau(), tm = 5 * T, X = t => pl.x + 50 + t / tm * (pl.w - 70), Y = u => pl.y + pl.h - 46 - u / (BA.v || 1) * (pl.h - 110);
    ctx.save(); ctx.strokeStyle = COL.line; ctx.beginPath(); ctx.moveTo(X(0), Y(0)); ctx.lineTo(X(tm), Y(0)); ctx.moveTo(X(0), Y(0)); ctx.lineTo(X(0), Y(BA.v)); ctx.stroke(); ctx.restore();
    ctx.save(); ctx.strokeStyle = COL.primary; ctx.lineWidth = 2.5; ctx.beginPath(); for (let i = 0; i <= 200; i++) { const t = tm * i / 200, y = Y(BA.v * Math.exp(-t / T)); i ? ctx.lineTo(X(t), y) : ctx.moveTo(X(t), y); } ctx.stroke(); ctx.restore();
    ctx.save(); ctx.strokeStyle = COL.accent; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.moveTo(X(T), Y(0)); ctx.lineTo(X(T), Y(BA.v)); ctx.stroke(); ctx.restore();
    text(`τ = mR/(BL)² = ${fp(T, 3)} s`, X(T) + 6, Y(BA.v) + 6, COL.accentStrong, 12, 'left', 600);
    if (BA.run) { ctx.fillStyle = COL.primary; ctx.beginPath(); ctx.arc(X(Math.min(tt, tm)), Y(vt), 6, 0, 2 * Math.PI); ctx.fill(); }
    text(`Fv = ${fp(baF() * BA.v, 3)} W  ·  I²R = ${fp(baI() ** 2 * BA.R, 3)} W`, pl.x + 16, pl.y + 44, COL.ink, 12, 'left', 600);
  },
};

// ═════════════════════════ ESCENA 4 · GENERADOR ═════════════════════════
const GE = { N: 100, a: 0.10, b: 0.20, B: 0.3, f: 60, t0: performance.now(), reto: null };
const geW = () => 2 * Math.PI * GE.f, geMax = () => GE.N * GE.B * GE.a * GE.b * geW();
const geSnap = () => JSON.stringify([GE.N, GE.a, GE.b, GE.B, GE.f]);
const scGenerador = {
  title: 'Generador',
  tools: () => `<div class="tool-group"><span class="tool-group__label">Bobina</span><button class="btn tog active" type="button" tabindex="-1">Gira con rapidez angular ω = 2πf</button></div>`,
  act() {},
  values: () => [
    { k: 'N', sym: 'N', min: 1, max: 500, step: 1, get: () => GE.N, set: x => GE.N = x, fmt: x => x + ' vueltas' },
    { k: 'a', sym: 'a', min: 2, max: 30, step: 1, get: () => GE.a * 100, set: x => GE.a = x / 100, fmt: x => x + ' cm' },
    { k: 'b', sym: 'b', min: 2, max: 30, step: 1, get: () => GE.b * 100, set: x => GE.b = x / 100, fmt: x => x + ' cm' },
    { k: 'B', sym: 'B', min: 0.05, max: 1, step: 0.05, get: () => GE.B, set: x => GE.B = x, fmt: x => fp(x, 2) + ' T' },
    { k: 'f', sym: 'f', min: 1, max: 120, step: 1, get: () => GE.f, set: x => GE.f = x, fmt: x => x + ' Hz', label: 'Frecuencia de giro' }],
  valuesNote: 'La animación va más lenta que la frecuencia real: una vuelta cada 3 s.',
  newReto() { GE.N = pick([50, 100, 200, 500]); GE.a = pick([5, 10, 15, 20]) / 100; GE.b = pick([10, 20, 25]) / 100; GE.B = pick([0.1, 0.2, 0.3, 0.5]); GE.f = pick([10, 25, 50, 60]); GE.reto = geSnap(); },
  retoText() { return `Una bobina de ${GE.N} vueltas, de ${fp(GE.a * 100, 0)} cm × ${fp(GE.b * 100, 0)} cm, gira a ${GE.f} Hz en un campo uniforme de ${fp(GE.B, 2)} T. ¿En qué posición de la bobina es máxima la fem y cuánto vale ese máximo?`; },
  retoTag: 'Resuelto 5 y retos 8–9 del taller',
  changed() { return !!GE.reto && geSnap() !== GE.reto; },
  predQ: '¿En qué posición de la bobina es máxima la fem?',
  choices: [{ id: 'par', label: 'Plano paralelo a B' }, { id: 'perp', label: 'Plano perpendicular a B' }, { id: 'igual', label: 'Es igual siempre' }],
  ansLabel: 'Tu valor de la fem máxima, en voltios',
  ansPh: 'ej. 226',
  hasPred: () => !!pred.choice,
  check() {
    const e = geMax(), v = parseNum($('#ans-val').value), rows = [], dOk = pred.choice === 'par', lab = { par: 'plano paralelo a B', perp: 'plano perpendicular a B', igual: 'igual siempre' };
    rows.push({ t: `Posición: ${lab[pred.choice]}`, ok: dOk, chip: dOk ? 'correcto' : 'incorrecto' });
    let vOk = null;
    if (isFinite(v)) { vOk = near(Math.abs(v), e, 0.03); rows.push({ t: `Tu \\(\\varepsilon_{\\max}\\): ${sp(v, 3)} V`, ok: vOk, chip: vOk ? 'correcto' : 'revisa' }); }
    else rows.push({ t: 'Valor: sin respuesta', ok: null, chip: 'escribe un número' });
    const av = Math.abs(v); let t;
    if (!dOk && pred.choice === 'perp') t = 'Con el plano perpendicular a \\(\\vec B\\) el flujo es máximo, pero en ese instante no cambia: la fem es cero. Es máxima cuando el flujo pasa por cero, que es cuando cambia más rápido.';
    else if (!dOk) t = 'La fem sigue \\(\\varepsilon=NBA\\omega\\sin\\omega t\\): oscila. Es máxima cuando el flujo \\(NBA\\cos\\omega t\\) pasa por cero, con el plano de la bobina paralelo a \\(\\vec B\\).';
    else if (vOk === false && near(av, e / (2 * Math.PI), 0.03)) t = 'Usa la frecuencia angular, \\(\\omega=2\\pi f\\), no \\(f\\).';
    else if (vOk === false && near(av, e / Math.SQRT2, 0.03)) t = 'Ese es el valor eficaz. El pico es \\(\\sqrt2\\) veces mayor.';
    else if (vOk === false && near(av, e / GE.N, 0.03)) t = `Te faltó multiplicar por las ${GE.N} vueltas.`;
    else if (vOk === false && (near(av, e * 1e4, 0.03) || near(av, e * 100, 0.03))) t = 'Revisa unidades: el área va en m².';
    else if (vOk === false) t = '\\(\\varepsilon_{\\max}=NBA\\omega\\), con \\(\\omega=2\\pi f\\) y el área en m².';
    else t = `Bien. Su valor eficaz es \\(\\varepsilon_{\\max}/\\sqrt2=${sx(e / Math.SQRT2)}\\) V. Mira en la gráfica cómo la fem es máxima cuando el flujo cruza el cero.`;
    return { rows, tip: t, allOk: dOk && vOk === true };
  },
  solution() { return `<p>Con el ángulo \\(\\omega t\\) entre la normal y \\(\\vec B\\): \\(\\Phi=NBA\\cos\\omega t\\) y \\(\\varepsilon=-d\\Phi/dt=NBA\\omega\\sin\\omega t\\). Es máxima con \\(\\omega t=90^\\circ\\): normal perpendicular a \\(\\vec B\\), plano de la bobina paralelo a \\(\\vec B\\).</p>\\[\\varepsilon_{\\max}=NBA\\omega=(${GE.N})(${fx(GE.B, 2)})(${fx(GE.a * GE.b, 4)})(2\\pi\\cdot${GE.f})=${sx(geMax())}\\ \\text{V}\\]`; },
  live() { const r = reveal(); return String.raw`\varepsilon_{\max}=NBA\omega=(${GE.N})(${fx(GE.B, 2)})(${fx(GE.a * GE.b, 4)})(2\pi\cdot${GE.f})=${r ? sx(geMax()) : '\\,?'}\,\text{V}`; },
  coords: () => `ω = ${fp(geW(), 1)} rad/s`,
  animating: () => true,
  draw() {
    const wide = W > 760, wv = wide ? W * 0.5 : W, rv = reveal(), cx = wide ? wv * 0.62 + 20 : wv * 0.5, cy = HU * (wide ? 0.6 : 0.5), R = Math.min(wv, HU) * (wide ? 0.26 : 0.3), th = ((performance.now() - GE.t0) / 3000) * 2 * Math.PI;
    bPlane(0, 0, 0, wv, HU, W < 600 ? 40 : 48); text('B → (uniforme)', 16, 24, COL.field, 13, 'left', 600);
    // bobina de canto: su normal forma el ángulo th con B
    const ux = cx + R * Math.cos(th + Math.PI / 2), uy = cy - R * Math.sin(th + Math.PI / 2), dx = cx - R * Math.cos(th + Math.PI / 2), dy = cy + R * Math.sin(th + Math.PI / 2);
    ctx.save(); ctx.strokeStyle = COL.primary; ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(ux, uy); ctx.lineTo(dx, dy); ctx.stroke(); ctx.restore();

    text(rv ? `ε = ${fp(geMax() * e, 1)} V` : 'ε = ?', cx, cy + R + 32, COL.primary, 15, 'center', 700);
    text('Vista de canto: el eje de giro sale de la página', 16, HU - 12, COL.muted, 12);
    const pl = wide ? { x: W * 0.52, y: 20, w: W * 0.48 - 20, h: Math.min(HU - 40, 340) } : null; if (!pl) return;
    plotAxes(pl, 'Flujo NΦ y fem durante dos vueltas');
    if (!rv) { hint(pl, 'Comprueba tu predicción para ver las curvas.'); return; }
    const X = u => pl.x + 30 + u / (4 * Math.PI) * (pl.w - 50), mid = pl.y + pl.h / 2 + 8, hh = (pl.h - 110) / 2;
    ctx.save(); ctx.strokeStyle = COL.line; ctx.beginPath(); ctx.moveTo(X(0), mid); ctx.lineTo(X(4 * Math.PI), mid); ctx.stroke(); ctx.restore();
    [[Math.cos, COL.field, 'NΦ'], [Math.sin, COL.primary, 'ε']].forEach(([f, c, l], i) => { ctx.save(); ctx.strokeStyle = c; ctx.lineWidth = 2.5; ctx.beginPath(); for (let k = 0; k <= 240; k++) { const u = 4 * Math.PI * k / 240, y = mid - f(u) * hh; k ? ctx.lineTo(X(u), y) : ctx.moveTo(X(u), y); } ctx.stroke(); ctx.restore(); text(l, pl.x + pl.w - 20, pl.y + 46 + i * 18, c, 13, 'right', 700); });
    const u = th % (4 * Math.PI); ctx.save(); ctx.strokeStyle = COL.accent; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.moveTo(X(u), pl.y + 36); ctx.lineTo(X(u), pl.y + pl.h - 30); ctx.stroke(); ctx.restore();
    text(`pico ${fp(geMax(), 1)} V · eficaz ${fp(geMax() / Math.SQRT2, 1)} V`, pl.x + 16, pl.y + 46, COL.ink, 12, 'left', 600);
  },
};

// ───────────────────────── orquestación ─────────────────────────
const SC = { flujo: scFlujo, iman: scIman, barra: scBarra, generador: scGenerador };

const sc = () => SC[app.scene];

function draw() {
  if (!W) return;
  readColors();
  ctx.clearRect(0, 0, W, H);
  sc().draw();
  $('#coords-indicator').textContent = sc().coords();
  renderLive();
}
let liveKey = '';
function renderLive() { const t = sc().live(); if (t !== liveKey) { liveKey = t; $('#live-tex').innerHTML = K(t); } }
// Escenas animadas (órbita y espira soltada): se redibujan en cada cuadro.
(function tick() { if (W && sc().animating && sc().animating() && !matchMedia('(prefers-reduced-motion: reduce)').matches) draw(); requestAnimationFrame(tick); })();

function buildToolbar() { $('#toolbar').innerHTML = sc().tools(); draw(); }
function buildValues() {
  const box = $('#values-body'), vals = sc().values();
  box.innerHTML = vals.map((v, i) => `<label class="vrange" title="${v.label || ''}"><span class="sym">${v.sym}${v.sub ? `<sub style="font-style:normal;font-size:.7em">${v.sub}</sub>` : ''}</span><input type="range" min="${v.min}" max="${v.max}" step="${v.step}" value="${v.get()}" data-i="${i}" aria-label="${v.label || v.sym}"><output>${v.fmt(v.get())}</output></label>`).join('') + (sc().valuesNote ? `<div class="vnote">${sc().valuesNote}</div>` : '');
  box.querySelectorAll('input').forEach(inp => inp.addEventListener('input', () => {
    const v = vals[+inp.dataset.i]; v.set(parseFloat(inp.value)); inp.nextElementSibling.textContent = v.fmt(v.get()); invalidate(); draw(); renderPanel(false);
  }));
}
function renderReto() {
  mixed($('#reto-text'), sc().retoText());
  $('#reto-tag').textContent = sc().retoTag;
  const ch = $('#pred-choices'); ch.innerHTML = sc().choices.map(c => `<button class="btn ${pred.choice === c.id ? 'on' : ''}" data-choice="${c.id}" type="button">${c.label}</button>`).join('');
  mixed($('#pred-q'), sc().predQ);
  $('#ans-val').placeholder = sc().ansPh;
}
let ansKey = '';
function renderPanel(full = true) {
  const s = sc(), hasP = s.hasPred();
  const al = s.ansLabel; if (al !== ansKey) { ansKey = al; mixed($('#ans-label'), al); }
  $('#pred-hint').textContent = s.predHint ? s.predHint() : '';
  $('#reto-note').textContent = s.changed() ? 'Cambiaste el montaje del reto: se comprueba con lo que ves en el lienzo.' : '';
  if (full) $('#pred-choices').querySelectorAll('[data-choice]').forEach(b => b.classList.toggle('on', b.dataset.choice === pred.choice));
  $('#st2').dataset.s = hasP ? 'done' : 'now';
  $('#st3').dataset.s = app.checked ? 'done' : hasP ? 'now' : 'todo';
  $('#st4').dataset.s = app.checked ? (app.result?.allOk ? 'done' : 'now') : 'todo';
  const box = $('#validation-box');
  if (app.checked && app.result) {
    box.innerHTML = app.result.rows.map(r => `<div class="vrow"><span>${r.t}</span><span class="e10-chip ${r.ok === true ? 'e10-chip--ok' : r.ok === false ? 'e10-chip--bad' : 'e10-chip--warn'}">${r.chip}</span></div>`).join('');
    if (window.renderMathInElement) renderMathInElement(box, { delimiters: [{ left: '\\(', right: '\\)', display: false }], throwOnError: false });
    mixed($('#explain'), `<div class="e10-tip__title">${app.result.allOk ? 'Muy bien' : 'Recomendación'}</div>${app.result.tip}`);
  } else { box.innerHTML = ''; $('#explain').innerHTML = ''; }
  $('#btn-sol').hidden = !app.checked;
  const sol = $('#solution'); sol.hidden = !(app.checked && app.showSol);
  if (!sol.hidden) mixed(sol, s.solution());
  const n = 1 + (hasP ? 1 : 0) + (app.checked ? 1 : 0) + (app.result?.allOk ? 1 : 0);
  $('#prog').style.setProperty('--e10-p', n * 25 + '%'); $('#prog-bar').setAttribute('aria-valuenow', n * 25); $('#prog-txt').textContent = `${n} de 4`;
}
function newReto() { sc().newReto(); resetPred(); buildToolbar(); buildValues(); renderReto(); renderPanel(); draw(); }
const seen = {};
function setScene(id, push = true) {
  if (!SC[id]) id = 'flujo';
  app.scene = id;
  document.querySelectorAll('.scene-tabs [data-scene]').forEach(b => b.setAttribute('aria-selected', b.dataset.scene === id));
  if (!seen[id]) { seen[id] = true; sc().newReto(); }
  $('#values').open = window.innerWidth > 900;
  resetPred(); buildToolbar(); buildValues(); renderReto(); renderPanel(); liveKey = ''; draw();
  if (push && location.hash !== '#' + id) history.replaceState(null, '', '#' + id);
}

// Clasifica la recomendación en un código estable para las métricas del portal (js/seguimiento.js · ERRORES).
function codigoError(tip) {
  const R = [[/Esa es la fem/, 'fem_vs_corriente'], [/Ese es el flujo, no la fem|ritmo/, 'flujo_vs_fem'], [/frecuencia angular/, 'omega_f'], [/valor eficaz\. El pico/, 'eficaz_pico'],
    [/flujo es máximo, pero|Es máxima cuando el flujo/, 'fem_max_posicion'], [/no hay fem|no hay corriente|no hay fem inducida|Hay corriente|hay fem/, 'flujo_constante'],
    [/Ley de Lenz|Dos formas de verlo/, 'lenz_sentido'], [/normal de la bobina/, 'coseno_flujo'], [/\Delta B=B_2-B_1/, 'delta_b'], [/vueltas\./, 'faltan_vueltas'], [/unidades/, 'unidades']];
  for (const [re, c] of R) if (re.test(tip || '')) return c;
  return 'otro';
}

// ───────────────────────── eventos ─────────────────────────
$('#toolbar').addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && !b.disabled) { sc().act(b.dataset.act); renderPanel(false); } });
document.querySelectorAll('.scene-tabs [data-scene]').forEach(b => b.addEventListener('click', () => setScene(b.dataset.scene)));
$('#pred-choices').addEventListener('click', e => {
  const b = e.target.closest('[data-choice]'); if (!b) return;
  pred.choice = b.dataset.choice; if (pred.choice !== 'plano') pred.angle = null; app.checked = false; app.result = null; app.showSol = false; renderPanel(); draw();
});
$('#btn-check').addEventListener('click', () => {
  if (!sc().hasPred()) { $('#check-hint').textContent = pred.choice === 'plano' ? 'Dibuja la dirección de la fuerza tocando el lienzo.' : 'Primero haz tu predicción en el paso 2.'; return; }
  $('#check-hint').textContent = '';
  app.result = sc().check(); app.checked = true; app.showSol = false;
  lab10Bus.emitTelemetry('comprobar', { escena: app.scene, ok: !!app.result.allOk, error: app.result.allOk ? null : codigoError(app.result.tip) });
  renderPanel(); liveKey = ''; buildToolbar();
  if (window.innerWidth <= 900) $('#right-panel').classList.add('open');
});
$('#ans-val').addEventListener('keydown', e => { if (e.key === 'Enter') $('#btn-check').click(); });
$('#btn-sol').addEventListener('click', () => { app.showSol = !app.showSol; renderPanel(false); });
$('#btn-new').addEventListener('click', newReto);
$('#sheet-handle').addEventListener('click', () => $('#right-panel').classList.toggle('open'));
$('#btn-projector').addEventListener('click', () => { document.body.classList.toggle('e10-projector'); $('#btn-projector').classList.toggle('active'); draw(); });
$('#btn-theme').addEventListener('click', () => { lab10Auth.toggleTheme(); try { localStorage.setItem('electro10_theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light'); } catch (_) {} });
new MutationObserver(() => { const i = $('#btn-theme i'); if (i) i.className = document.body.classList.contains('dark-mode') ? 'ph ph-sun' : 'ph ph-moon'; draw(); }).observe(document.body, { attributes: true, attributeFilter: ['class'] });
$('#user-info').addEventListener('click', () => { if (!lab10Auth.isAuthenticated) lab10Auth.loginGoogle(); });
lab10Auth.onAuthChange((ok, user) => { $('#user-info').textContent = ok ? (user?.displayName || 'Estudiante') : 'Iniciar sesión'; });

const pos = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
cv.addEventListener('pointerdown', e => { if (!sc().down) return; cv.setPointerCapture(e.pointerId); sc().down(...pos(e)); draw(); });
cv.addEventListener('pointermove', e => { if (!sc().move) return; sc().move(...pos(e)); if (e.buttons) draw(); });
cv.addEventListener('pointerup', e => { if (sc().up) sc().up(...pos(e)); draw(); });
cv.addEventListener('pointercancel', () => { if (sc().up) sc().up(); });
window.addEventListener('hashchange', () => { const id = location.hash.slice(1); if (SC[id] && id !== app.scene) setScene(id, false); });

// ───────────────────────── Lab10 Bus ─────────────────────────
lab10Bus.injectContinueButton($('#continue-wrap'), 'Sim_M11_EcuacionesMaxwell.html', 'Ecuaciones de Maxwell (capítulo 12)', () => ({
  source: 'FaradayLab10', units: { length: 'm', field: 'T', emf: 'V' },
  entities: {}, metrics: { fem_flujo: flEps(), fem_barra: baEps(), fem_generador: geMax() }, timestamp: Date.now(),
}));

// ───────────────────────── arranque ─────────────────────────
new ResizeObserver(resize).observe(area);
setScene((location.hash || '#flujo').slice(1), false);
window.__far = { app, pred, FL, IM, BA, GE, flEps, flCat, flDphi, imPhi, imDphi, imEps, imCat, baEps, baI, baF, baTau, baCat, geMax, setScene, codigoError };
</script>
