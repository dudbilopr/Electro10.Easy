<style>
/* VectorFieldLab10.easy · diseño 10.Easy (Plasma). Colores solo desde css/tokens.css. */
:root{--panel-w:400px;--accent:var(--e10-primary)}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}

button,input,select{font-family:inherit}
canvas,.h-menu,header{user-select:none}

header.e10-header{flex-shrink:0;z-index:100;gap:10px;flex-wrap:nowrap}

.header-actions{display:flex;align-items:center;gap:8px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 14px;border:1px solid var(--e10-line);border-radius:var(--e10-radius-sm);background:var(--e10-surface);color:var(--e10-ink);cursor:pointer;font:500 var(--e10-text-sm)/1 var(--e10-font-body);white-space:nowrap;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--e10-primary)}
.btn:focus-visible{outline:none;box-shadow:var(--e10-focus)}
.btn.active{background:var(--e10-primary);border-color:var(--e10-primary);color:var(--e10-on-primary);font-weight:600}
.btn-primary{background:var(--e10-primary);border-color:var(--e10-primary);color:var(--e10-on-primary);font-weight:600}
.btn-primary:hover{background:var(--e10-primary-hover);border-color:var(--e10-primary-hover)}
.btn-icon{width:40px;padding:0}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn i{font-size:1.1em}
.btn .sym{font:italic 600 1.05em/1 'Times New Roman',serif}
.tog{min-height:34px;padding:0 12px;border-radius:999px;font-size:var(--e10-text-xs);color:var(--e10-muted)}
.tog.active{background:var(--e10-primary-soft);border-color:var(--e10-primary);color:var(--e10-primary);font-weight:600}
.seg{display:flex;padding:3px;border-radius:var(--e10-radius-md);background:var(--e10-grid)}
.seg .btn{min-height:34px;border:0;background:transparent;color:var(--e10-muted)}

.h-menu{flex-shrink:0;display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--e10-surface);border-bottom:1px solid var(--e10-line);z-index:90;flex-wrap:wrap}
.tool-group{display:flex;align-items:center;gap:6px}
.tool-group__label{font:500 11px/1 var(--e10-font-mono);letter-spacing:.08em;color:var(--e10-muted);margin-right:2px;text-transform:uppercase}
.tool-sep{width:1px;height:28px;background:var(--e10-line)}

.workspace{position:relative;flex:1;display:flex;overflow:hidden;min-height:0}
.canvas-area{flex:1;position:relative;overflow:hidden;min-width:0;background-color:var(--e10-surface-2);background-image:linear-gradient(var(--e10-grid) 1px,transparent 1px),linear-gradient(90deg,var(--e10-grid) 1px,transparent 1px);background-size:32px 32px}
canvas{position:absolute;top:0;left:0;z-index:1;touch-action:none}

#values{position:absolute;top:10px;left:10px;z-index:5;background:var(--e10-surface);border:1px solid var(--e10-line);border-radius:var(--e10-radius-md);box-shadow:var(--e10-shadow);width:330px;max-width:calc(100% - 20px)}
#values>summary{cursor:pointer;list-style:none;padding:8px 12px;font:500 11px/1.4 var(--e10-font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--e10-muted)}

.vrange .sym{font:italic 1.05rem/1 'Times New Roman',serif;color:var(--e10-ink)}

.vnote{font-size:var(--e10-text-xs);color:var(--e10-muted);line-height:1.4}

.sheet-handle{display:none}

.e10-step__n{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:500 12px/1 var(--e10-font-mono);background:var(--e10-line);color:var(--e10-muted)}
.e10-step[data-s="done"] .e10-step__n{background:var(--e10-success);color:#fff}
.e10-step[data-s="now"] .e10-step__n{background:var(--e10-primary);color:var(--e10-on-primary)}
.e10-step__body{display:flex;flex-direction:column;gap:8px;min-width:0}
.e10-step__title{font:600 .95rem/1.3 var(--e10-font-display)}
.e10-step[data-s="todo"] .e10-step__title{color:var(--e10-muted)}

.reto-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.reto-actions .btn{min-height:32px;font-size:var(--e10-text-xs)}
#reto-note{font-size:var(--e10-text-xs);color:var(--e10-warning)}

.e10-chip--info{background:var(--e10-accent-soft);color:var(--e10-accent-strong)}
.e10-chip--bad{background:var(--e10-danger-soft);color:var(--e10-danger)}
.predict-row{display:flex;gap:8px;flex-wrap:wrap}
.predict-row .btn{min-height:36px}
.predict-row .btn.on{background:var(--e10-primary-soft);border-color:var(--e10-primary);color:var(--e10-primary);font-weight:600}
#pred-hint{font-size:var(--e10-text-xs);color:var(--e10-muted)}
.ans{display:grid;gap:4px;font-size:var(--e10-text-xs);color:var(--e10-muted)}
.ans input{background:var(--e10-surface);border:1px solid var(--e10-line);color:var(--e10-ink);min-height:38px;padding:6px 10px;border-radius:var(--e10-radius-sm);width:100%;font:500 var(--e10-text-sm) var(--e10-font-mono);outline:none}
.ans input:focus{border-color:var(--e10-primary);box-shadow:var(--e10-focus)}
#validation-box{display:flex;flex-direction:column;border:1px solid var(--e10-line);border-radius:var(--e10-radius-md);overflow:hidden}
#validation-box:empty{display:none}
.vrow{display:flex;align-items:center;gap:8px;padding:9px 12px;border-top:1px solid var(--e10-line)}
.vrow:first-child{border-top:0}
.vrow .e10-chip{margin-left:auto}
#check-hint{font-size:var(--e10-text-xs);color:var(--e10-muted)}
#check-hint:empty{display:none}
#explain{line-height:1.5}
#explain:empty{display:none}
#solution{padding:12px;border-radius:var(--e10-radius-md);background:var(--e10-bg);overflow-x:auto;line-height:1.6}
#solution .katex-display{margin:.4em 0}
.panel-progress{display:flex;align-items:center;gap:10px;padding:12px 18px;border-top:1px solid var(--e10-line)}
.panel-progress .e10-progress{flex:1}
.section-title{font:500 11px/1.4 var(--e10-font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--e10-muted)}
footer{flex-shrink:0;background:var(--e10-surface);border-top:1px solid var(--e10-line);padding:8px 16px;font-size:var(--e10-text-xs);color:var(--e10-muted);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
footer a{color:var(--e10-primary);text-decoration:none;font-weight:600}

/* Incrustado en una clase (?embed): solo escenas, herramientas y lienzo; la clase trae sus propias tareas */
body.embed .e10-brand,body.embed .module-chip,body.embed .header-actions,body.embed .slide-panel,body.embed footer{display:none}
body.embed header.e10-header{padding:6px 8px;min-height:0}
body.embed .scene-tabs{margin:0}
body.e10-projector{font-size:17px}
body.e10-projector #e10-live .katex{font-size:1.5em}

@media (max-width:900px){
  header.e10-header{padding:8px 10px;min-height:56px;flex-wrap:wrap}
  header .e10-brand{font-size:1rem}
  .module-chip,#btn-projector{display:none}
  .scene-tabs{order:5;margin:0;width:100%}
  .header-actions .btn{min-height:38px;padding:0 10px}
  .h-menu{order:3;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));gap:6px;border-top:1px solid var(--e10-line);border-bottom:0;flex-wrap:nowrap;overflow-x:auto}
  .h-menu .tool-group__label,.h-menu .tool-sep{display:none}
  .h-menu .btn{min-height:44px;font-size:12px;padding:0 10px}
  .workspace{flex-direction:column}
  .slide-panel{width:100%;max-height:48%;border-left:0;border-top:1px solid var(--e10-line);border-radius:18px 18px 0 0;box-shadow:0 -4px 16px rgba(34,17,27,.08);margin-top:-14px;position:relative}
  .slide-panel:not(.open){max-height:150px}
  .sheet-handle{display:flex;justify-content:center;padding:8px 0 2px;border:0;background:none;cursor:pointer;width:100%}
  .sheet-handle span{width:40px;height:4px;border-radius:2px;background:var(--e10-line)}
  .panel-scroll{padding:8px 16px 16px}
  .panel-progress{display:none}
  #e10-live{bottom:22px;left:10px;right:10px;padding:6px 10px;gap:10px;min-height:44px}
  #e10-live .e10-eyebrow{display:none}
  #e10-live .katex{font-size:.95em}
  #values-body{min-width:220px}
  #coords-indicator{display:none}
  footer{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

// ═════════════════════════ ESCENA 3 · DIPOLO EN CAMPO UNIFORME ═════════════════════════
const TQ = { q: 3, dmm: 2, E: 1e4, phi: 30, reto: null, w: 0, run: false, last: 0, drag: false };
const tqP = () => TQ.q * nC * TQ.dmm * 1e-3, tqTau = () => tqP() * TQ.E * Math.sin(rad(TQ.phi)), tqU = () => -tqP() * TQ.E * Math.cos(rad(TQ.phi));

  choices: HCHO,
  ansLabel: 'Tu desviación al salir, en mm',
  ansPh: 'ej. 13,2',
  hasPred: () => !!pred.choice,
  check() {
    const y = hzY() * 1000, v = parseNum($('#ans-val').value), rows = [], real = hzCat(), dOk = pred.choice === real;
    rows.push({ t: `Desviación: ${HCHO.find(c => c.id === pred.choice).label.toLowerCase()}`, ok: dOk, chip: dOk ? 'correcto' : 'incorrecto' });
    let vOk = null; if (isFinite(v)) { vOk = near(Math.abs(v), y, 0.03); rows.push({ t: `Tu \\(y\\): ${sp(v, 3)} mm`, ok: vOk, chip: vOk ? 'correcto' : 'revisa' }); } else rows.push({ t: 'Valor: sin respuesta', ok: null, chip: 'escribe un número' });
    const av = Math.abs(v), other = hzY(HZ.part === 'electron' ? MP : ME) * 1000;
    let t, code = null;
    if (!dOk) { code = 'haz_sentido'; t = HZ.part === 'electron' ? 'El electrón es negativo: \\(\\vec F=-e\\vec E\\) apunta <b>contra</b> el campo. Si \\(\\vec E\\) va hacia arriba, el electrón se curva hacia abajo.' : 'El protón es positivo: \\(\\vec F=e\\vec E\\) va en el sentido del campo.'; }
    else if (vOk === false && near(av, 2 * y, 0.03)) { code = 'haz_medio'; t = 'Te faltó el ½: con aceleración constante desde \\(v_y=0\\), \\(y=\\tfrac12at^2\\).'; }
    else if (vOk === false && near(av, other, 0.03)) { code = 'haz_masa'; t = `Usaste la masa del ${HZ.part === 'electron' ? 'protón' : 'electrón'}. La aceleración es \\(eE/m\\) con la masa de la partícula del reto.`; }
    else if (vOk === false && (near(av, y / 1000, 0.03) || near(av, y / 10, 0.03))) { code = 'unidades'; t = 'Tu número está bien, pero en otra unidad: el reto pide milímetros (1 m = 1000 mm).'; }
    else if (vOk === false) { code = 'haz_medio'; t = 'Usa \\(t=L/v_0\\) (en \\(x\\) no hay fuerza) y \\(y=\\tfrac12(eE/m)t^2\\), con \\(L\\) en metros.'; }
    else if (vOk === null) t = 'El sentido está bien. Escribe la desviación.';
    else t = `Muy bien. Sale a ${fp(Math.atan(2 * hzY() / HZ.L) * DEG, 1)}° de la horizontal. Pulsa «Lanzar» para verla.`;
    return { rows, tip: t, allOk: dOk && vOk === true, code };
  },
  solution() { const P_ = PART[HZ.part], a = QE * Math.abs(HZ.E) / P_.m, t = HZ.L / HZ.v; return `<p>\\(a=\\dfrac{eE}{m}=${sx(a)}\\) m/s² ${HZ.part === 'electron' ? '(opuesta a \\(\\vec E\\))' : '(como \\(\\vec E\\))'}; \\(t=\\dfrac{L}{v_0}=${sx(t)}\\) s.</p>\\[y=\\tfrac12at^2=\\frac{eEL^2}{2mv_0^2}=${fx(hzY() * 1000, 2)}\\ \\text{mm}\\]`; },
  live() { const r = reveal(); return String.raw`y=\dfrac{|q|E\,L^2}{2mv_0^2}=${r ? fx(hzY() * 1000, 2) : '\\,?'}\ \text{mm}`; },
  coords: () => `${PART[HZ.part].n}`,
  animating: () => HZ.t0 > 0 && performance.now() - HZ.t0 < 2600,
  draw() {
    const S = Math.min(W * 0.8 / (HZ.L + 0.04), HU * 0.75 / HZ.gap), x0 = W * 0.18, cy = HU / 2, top = cy - HZ.gap / 2 * S, bot = cy + HZ.gap / 2 * S, xe = x0 + HZ.L * S, rv = reveal();
    const sTop = HZ.E >= 0 ? -1 : 1; // placa positiva abajo si E apunta hacia arriba
    ctx.save(); ctx.globalAlpha = 0.25; ctx.fillStyle = sTop < 0 ? COL.qneg : COL.qpos; ctx.fillRect(x0, top - 10, HZ.L * S, 10); ctx.fillStyle = sTop < 0 ? COL.qpos : COL.qneg; ctx.fillRect(x0, bot, HZ.L * S, 10); ctx.restore();
    text(sTop < 0 ? 'placa negativa' : 'placa positiva', x0 + 6, top - 20, COL.muted, 12); text(sTop < 0 ? 'placa positiva' : 'placa negativa', x0 + 6, bot + 24, COL.muted, 12);
    if (HZ.E !== 0) { ctx.save(); ctx.globalAlpha = 0.4; for (let x = x0 + 30; x < xe; x += 60) { if (HZ.E > 0) arrow(x, bot - 6, x, top + 6, COL.field, 1.6, 8); else arrow(x, top + 6, x, bot - 6, COL.field, 1.6, 8); } ctx.restore(); text('E', xe + 10, cy, COL.field, 15, 'left', 700); }
    const P_ = PART[HZ.part], sgn = hzCat() === 'up' ? -1 : 1, yof = (x) => QE * Math.abs(HZ.E) * x * x / (2 * P_.m * HZ.v ** 2);
    arrow(20, cy, x0 - 14, cy, COL.ink, 2, 9); text('v₀', 24, cy - 14, COL.ink, 13);
    if (rv) {
      ctx.save(); ctx.strokeStyle = COL.primary; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x0, cy); let hit = false;
      for (let k = 0; k <= 200; k++) { const x = HZ.L * k / 200, y = yof(x); if (y > HZ.gap / 2) { hit = true; break; } ctx.lineTo(x0 + x * S, cy + sgn * y * S); }
      if (!hit) { const sl = QE * Math.abs(HZ.E) * HZ.L / (P_.m * HZ.v ** 2); ctx.lineTo(W - 10, cy + sgn * (yof(HZ.L) + sl * (W - 10 - xe) / S) * S); }
      ctx.stroke(); ctx.restore();
      if (HZ.t0 > 0) { const f = Math.min(1, (performance.now() - HZ.t0) / 2000), x = HZ.L * f; charge(x0 + x * S, cy + sgn * Math.min(yof(x), HZ.gap / 2) * S, P_.q, 8); }
      text(`y = ${fp(hzY() * 1000, 2)} mm`, xe + 10, cy + sgn * yof(HZ.L) * S + 18 * sgn, COL.primary, 14, 'left', 700);
    }
    charge(x0, cy, P_.q, 9);
    text('Escala real · partícula entrando por el centro', 14, HU - 12, COL.muted, 12);
  },
};

// ───────────────────────── orquestación ─────────────────────────
const SC = { campo: scCampo, dipolo: scDipolo, torque: scTorque, haz: scHaz };
const sc = () => SC[app.scene];
function draw() { if (!W) return; readColors(); ctx.clearRect(0, 0, W, H); sc().draw(); $('#coords-indicator').textContent = sc().coords(); renderLive(); }
let liveKey = '';
function renderLive() { const t = sc().live(); if (t !== liveKey) { liveKey = t; $('#live-tex').innerHTML = K_(t); } }
(function tick() { if (W && sc().animating && sc().animating() && !matchMedia('(prefers-reduced-motion: reduce)').matches) draw(); requestAnimationFrame(tick); })();
function buildToolbar() { $('#toolbar').innerHTML = sc().tools(); draw(); }
function buildValues() {
  const box = $('#values-body'), vals = sc().values();
  box.innerHTML = vals.map((v, i) => `<label class="vrange" title="${v.label || ''}"><span class="sym">${v.sym}${v.sub ? `<sub style="font-style:normal;font-size:.7em">${v.sub}</sub>` : ''}</span><input type="range" min="${v.min}" max="${v.max}" step="${v.step}" value="${v.get()}" data-i="${i}" aria-label="${v.label || v.sym}"><output>${v.fmt(v.get())}</output></label>`).join('') + (sc().valuesNote ? `<div class="vnote">${sc().valuesNote}</div>` : '');
  box.querySelectorAll('input').forEach(inp => inp.addEventListener('input', () => { const v = vals[+inp.dataset.i]; v.set(parseFloat(inp.value)); inp.nextElementSibling.textContent = v.fmt(v.get()); invalidate(); draw(); }));
}
function renderReto() {
  mixed($('#reto-text'), sc().retoText()); $('#reto-tag').textContent = sc().retoTag;
  $('#pred-choices').innerHTML = sc().choices.map(c => `<button class="btn ${pred.choice === c.id ? 'on' : ''}" data-choice="${c.id}" type="button">${c.label}</button>`).join('');
  mixed($('#pred-q'), sc().predQ); $('#ans-val').placeholder = sc().ansPh;
}
let ansKey = '';
function renderPanel(full = true) {
  const s = sc(), hasP = s.hasPred();
  const al = s.ansLabel; if (al !== ansKey) { ansKey = al; mixed($('#ans-label'), al); }
  $('#pred-hint').textContent = s.predHint ? s.predHint() : '';
  $('#reto-note').textContent = s.changed() ? 'Cambiaste el montaje del reto: se comprueba con lo que ves en el lienzo.' : '';
  if (full) $('#pred-choices').querySelectorAll('[data-choice]').forEach(b => b.classList.toggle('on', b.dataset.choice === pred.choice));
  $('#st2').dataset.s = hasP ? 'done' : 'now';
  $('#st3').dataset.s = app.checked ? 'done' : hasP ? 'now' : 'todo';
  $('#st4').dataset.s = app.checked ? (app.result?.allOk ? 'done' : 'now') : 'todo';
  const box = $('#validation-box');
  if (app.checked && app.result) {
    box.innerHTML = app.result.rows.map(r => `<div class="vrow"><span>${r.t}</span><span class="e10-chip ${r.ok === true ? 'e10-chip--ok' : r.ok === false ? 'e10-chip--bad' : 'e10-chip--warn'}">${r.chip}</span></div>`).join('');
    if (window.renderMathInElement) renderMathInElement(box, { delimiters: [{ left: '\\(', right: '\\)', display: false }], throwOnError: false });
    mixed($('#explain'), `<div class="e10-tip__title">${app.result.allOk ? 'Muy bien' : 'Recomendación'}</div>${app.result.tip}`);
  } else { box.innerHTML = ''; $('#explain').innerHTML = ''; }
  $('#btn-sol').hidden = !app.checked;
  const pr = $('#btn-practice'), code = app.checked && app.result && app.result.code, dest = code && PRACTICA[code];
  pr.hidden = !dest || dest === app.scene; if (dest) { pr.href = '#' + dest; pr.textContent = `Practicar en la escena «${{ campo: 'Campo de cargas', dipolo: 'Dipolo', torque: 'Dipolo en E uniforme', haz: 'Carga entre placas' }[dest]}»`; }
  const sol = $('#solution'); sol.hidden = !(app.checked && app.showSol); if (!sol.hidden) mixed(sol, s.solution());
  const n = 1 + (hasP ? 1 : 0) + (app.checked ? 1 : 0) + (app.result?.allOk ? 1 : 0);
  $('#prog').style.setProperty('--e10-p', n * 25 + '%'); $('#prog-bar').setAttribute('aria-valuenow', n * 25); $('#prog-txt').textContent = `${n} de 4`;
}
// Escena donde se practica cada error (la misma lista que usa js/seguimiento.js para el botón «Practicar»)
const PRACTICA = { campo_sentido_negativa: 'campo', campo_una_carga: 'campo', campo_suma_modulos: 'campo', campo_inverso_r: 'campo', campo_direccion: 'campo', dipolo_direccion: 'dipolo', dipolo_aprox: 'dipolo', dipolo_factor2: 'dipolo', dipolo_r2: 'dipolo', torque_sentido: 'torque', torque_coseno: 'torque', torque_sin_d: 'torque', haz_sentido: 'haz', haz_medio: 'haz', haz_masa: 'haz' };
function newReto() { sc().newReto(); resetPred(); buildToolbar(); buildValues(); renderReto(); renderPanel(); draw(); }
const seen = {};
function setScene(id, push = true) {
  if (!SC[id]) id = 'campo';
  app.scene = id;
  document.querySelectorAll('.scene-tabs [data-scene]').forEach(b => b.setAttribute('aria-selected', b.dataset.scene === id));
  if (!seen[id]) { seen[id] = true; sc().newReto(); }
  $('#values').open = window.innerWidth > 900;
  resetPred(); buildToolbar(); buildValues(); renderReto(); renderPanel(); liveKey = ''; draw();
  if (push && location.hash !== '#' + id) history.replaceState(null, '', '#' + id);
}
function comprobar() {
  app.result = sc().check(); app.checked = true; app.showSol = false;
  lab10Bus.emitTelemetry('comprobar', { escena: app.scene, ok: !!app.result.allOk, error: app.result.allOk ? null : (app.result.code || 'otro') });
  renderPanel(); liveKey = ''; buildToolbar();
  return app.result;
}

// ───────────────────────── eventos ─────────────────────────
$('#toolbar').addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && !b.disabled) { sc().act(b.dataset.act); renderPanel(false); } });
document.querySelectorAll('.scene-tabs [data-scene]').forEach(b => b.addEventListener('click', () => setScene(b.dataset.scene)));
$('#pred-choices').addEventListener('click', e => { const b = e.target.closest('[data-choice]'); if (!b) return; pred.choice = b.dataset.choice; app.checked = false; app.result = null; app.showSol = false; renderPanel(); draw(); });
$('#btn-check').addEventListener('click', () => {
  if (!sc().hasPred()) { $('#check-hint').textContent = app.scene === 'campo' ? 'Primero dibuja la dirección del campo tocando el lienzo.' : 'Primero haz tu predicción en el paso 2.'; return; }
  $('#check-hint').textContent = ''; comprobar();
  if (window.innerWidth <= 900) $('#right-panel').classList.add('open');
});
$('#ans-val').addEventListener('keydown', e => { if (e.key === 'Enter') $('#btn-check').click(); });
$('#btn-sol').addEventListener('click', () => { app.showSol = !app.showSol; renderPanel(false); });
$('#btn-new').addEventListener('click', newReto);
$('#sheet-handle').addEventListener('click', () => $('#right-panel').classList.toggle('open'));
$('#btn-projector').addEventListener('click', () => { document.body.classList.toggle('e10-projector'); $('#btn-projector').classList.toggle('active'); draw(); });
$('#btn-theme').addEventListener('click', () => { lab10Auth.toggleTheme(); try { localStorage.setItem('electro10_theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light'); } catch (_) {} });
new MutationObserver(() => { const i = $('#btn-theme i'); if (i) i.className = document.body.classList.contains('dark-mode') ? 'ph ph-sun' : 'ph ph-moon'; draw(); }).observe(document.body, { attributes: true, attributeFilter: ['class'] });
$('#user-info').addEventListener('click', () => { if (!lab10Auth.isAuthenticated) lab10Auth.loginGoogle(); });
lab10Auth.onAuthChange((ok, user) => { $('#user-info').textContent = ok ? (user?.displayName || 'Estudiante') : 'Iniciar sesión'; });
const pos = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
cv.addEventListener('pointerdown', e => { if (!sc().down) return; cv.setPointerCapture(e.pointerId); sc().down(...pos(e)); draw(); });
cv.addEventListener('pointermove', e => { if (!sc().move || !e.buttons) return; sc().move(...pos(e)); draw(); });
cv.addEventListener('pointerup', e => { if (sc().up) sc().up(...pos(e)); draw(); });
cv.addEventListener('pointercancel', () => { if (sc().up) sc().up(); });
window.addEventListener('hashchange', () => { const id = location.hash.slice(1); if (SC[id] && id !== app.scene) setScene(id, false); });

lab10Bus.injectContinueButton($('#continue-wrap'), 'Potencial_Electrico.html', 'Potencial eléctrico (capítulo 3)', () => ({
  source: 'VectorFieldLab10', units: { length: 'm', field: 'N/C', charge: 'nC' },
  entities: { cargas: CA.qs }, metrics: { campo_P: field(caQs(), 0, 0).E, dipolo_E: diExact(), torque: Math.abs(tqTau()), desviacion_mm: hzY() * 1000 }, timestamp: Date.now(),
}));

// ───────────────────────── autoprueba (scripts/prueba_cap2.cjs) ─────────────────────────
// Monta casos fijos, responde bien y con cada error típico, y verifica el código que se registra.
function autotest() {
  const fallas = [], codigos = new Set(); let n = 0;
  const run = (scene, setup, choice, val, want) => { setScene(scene, false); setup(); resetPred(); if (typeof choice === 'number') { pred.angle = choice; pred.choice = 'dibuja'; } else pred.choice = choice; $('#ans-val').value = val === null ? '' : String(val); const r = comprobar(); n++; const got = r.allOk ? 'ok' : r.code; if (got !== want) fallas.push(`${scene}: esperaba ${want}, salió ${got} (${val})`); if (r.code) codigos.add(r.code); };
  const caFix = () => { CA.qs = [{ q: 5, x: 0, y: 0.3 }, { q: -4, x: 0.4, y: 0.3 }]; CA.reto = caSnap(); };
  const f = field([{ q: 5e-9, x: 0, y: 0.3 }, { q: -4e-9, x: 0.4, y: 0.3 }], 0, 0);
  if (Math.abs(f.E - 428.771) > 0.01) fallas.push('campo R4 ' + f.E);
  run('campo', caFix, f.a, f.E, 'ok');
  run('campo', caFix, f.a + 180, f.E, 'campo_sentido_negativa');
  run('campo', caFix, 270, f.E, 'campo_una_carga');
  run('campo', caFix, f.a, 643.141, 'campo_suma_modulos');
  run('campo', caFix, f.a + 40, f.E, 'campo_direccion');
  const diFix = (mode) => () => { DI.q = 4; DI.d = 0.12; DI.r = 0.30; DI.mode = mode; DI.reto = diSnap(); };
  if (Math.abs(2 * K * 4.8e-10 * 0.3 / (0.09 - 0.0036) ** 2 - 346.759) > 0.01) fallas.push('dipolo eje');
  run('dipolo', diFix('eje'), 'par', 346.759, 'ok');
  run('dipolo', diFix('eje'), 'anti', 346.759, 'dipolo_direccion');
  run('dipolo', diFix('eje'), 'par', 319.573, 'dipolo_aprox');
  run('dipolo', diFix('eje'), 'par', 346.759 / 2, 'dipolo_factor2');
  run('dipolo', diFix('eje'), 'par', K * 4e-9 / 0.09, 'dipolo_r2');
  run('dipolo', () => { diFix('med')(); DI.r = 0.08; DI.reto = diSnap(); }, 'anti', 4314.24, 'ok');
  const tqFix = (phi) => () => { TQ.q = 3; TQ.dmm = 2; TQ.E = 1e4; TQ.phi = phi; TQ.run = false; TQ.reto = tqSnap(); };
  const tau30 = 6e-12 * 1e4 * 0.5;
  run('torque', tqFix(30), 'cw', tau30, 'ok');
  run('torque', tqFix(30), 'ccw', tau30, 'torque_sentido');
  run('torque', tqFix(30), 'cw', 6e-12 * 1e4 * Math.cos(rad(30)), 'torque_coseno');
  run('torque', tqFix(30), 'cw', 3e-9 * 1e4 * 0.5, 'torque_sin_d');
  run('torque', tqFix(210), 'ccw', tau30, 'ok');
  run('torque', tqFix(180), 'none', 0, 'ok');
  const hzFix = (part) => () => { HZ.part = part; HZ.E = 1500; HZ.v = 4e6; HZ.L = 0.04; HZ.reto = hzSnap(); };
  run('haz', hzFix('electron'), 'down', 13.1903, 'ok');
  run('haz', hzFix('electron'), 'up', 13.1903, 'haz_sentido');
  run('haz', hzFix('electron'), 'down', 26.3806, 'haz_medio');
  run('haz', hzFix('electron'), 'down', 0.00718171, 'haz_masa');
  run('haz', hzFix('electron'), 'down', 0.0131903, 'unidades');
  setScene('campo', false);
  return { n, fallas, codigos: [...codigos] };
}

// ───────────────────────── arranque ─────────────────────────
new ResizeObserver(resize).observe(area);
setScene((location.hash || '#campo').slice(1), false);
window.__vfl = { app, pred, CA, DI, TQ, HZ, field, diExact, diApprox, tqTau, hzY, setScene, comprobar, autotest };
