  #e10-live .katex{font-size:.95em}
  #values-body{min-width:220px}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

function sciParts(v, d) {

function arrow(x1, y1, x2, y2, col, w = 2, head = 10, dash = null) {

    }
    const Rp = E.R * s;
    text('Corte por un plano que contiene el eje', 16, HU - 12, COL.muted, 12);
    if (E.showNeedles) needleField((x, y) => eField(x, y), (px, py) => ({ x: (px - cx) / s, y: (cy - py) / s }), W < 600 ? 34 : 40,
      (px, py) => (eView.plot && px > eView.plot.x - 20) || Math.hypot(px - cx, py - (cy - Rp)) < 22 || Math.hypot(px - cx, py - (cy + Rp)) < 22 || Math.hypot(px - (cx + E.z * s), py - cy) < 26);
    ctx.save(); ctx.strokeStyle = COL.muted; ctx.setLineDash([6, 5]); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(8, cy); ctx.lineTo(eView.plot ? eView.plot.x - 16 : W - 8, cy); ctx.stroke(); ctx.restore();
    sym('z', (eView.plot ? eView.plot.x - 26 : W - 20), cy - 12);
    ctx.save(); ctx.strokeStyle = COL.primary; ctx.globalAlpha = 0.3; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(cx, cy, Rp * 0.25, Rp, 0, 0, 2 * Math.PI); ctx.stroke(); ctx.restore();
    wireSym(cx, cy - Rp, E.ccw, 14, COL.primary); wireSym(cx, cy + Rp, -E.ccw, 14, COL.primary);
    text(`I = ${fp(E.I, 1)} A${E.mode === 'bobina' ? ` · N = ${E.N}` : ''}`, cx + 22, cy - Rp - 18, COL.primary, 13, 'left', 600);
    const px = cx + E.z * s, B = eAxis(E.z);
    ctx.fillStyle = COL.primary; ctx.beginPath(); ctx.arc(px, cy, 5, 0, 2 * Math.PI); ctx.fill(); sym('P', px - 4, cy + 20);
    if (app.checked) { const L = clamp(30 + 22 * Math.log10(B / 1e-7), 20, 110); arrow(px, cy, px + E.ccw * L, cy, COL.field, 4, 14); sym('B', px + E.ccw * (L + 12) - 4, cy - 14, COL.field, 18); }
    const pl = eView.plot; if (!pl) return;
    panelBox(pl.x, pl.y, pl.w, pl.h);
    text('B en el eje frente a z', pl.x + 16, pl.y + 22, COL.ink, 13, 'left', 600);
    const z0 = -3 * E.R, z1 = 3 * E.R, Bmax = eAxis(0) * 1.12;
    const X = z => pl.x + 40 + (z - z0) / (z1 - z0) * (pl.w - 60), Y = b => pl.y + pl.h - 50 - b / Bmax * (pl.h - 100);
    ctx.save(); ctx.strokeStyle = COL.line; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(X(z0), Y(0)); ctx.lineTo(X(z1), Y(0)); ctx.moveTo(X(0), Y(0)); ctx.lineTo(X(0), Y(Bmax)); ctx.stroke(); ctx.restore();
    if (E.showDip) { ctx.save(); ctx.strokeStyle = COL.accent; ctx.setLineDash([6, 5]); ctx.lineWidth = 1.5; [[z0, -0.9 * E.R], [0.9 * E.R, z1]].forEach(([a, b]) => { ctx.beginPath(); let st = false; for (let i = 0; i <= 80; i++) { const z = a + i * (b - a) / 80, bd = (E.mode === 'bobina' ? E.N : 1) * MU0 * E.I * E.R * E.R / (2 * Math.pow(Math.abs(z), 3)); if (bd > Bmax) { st = false; continue; } st ? ctx.lineTo(X(z), Y(bd)) : ctx.moveTo(X(z), Y(bd)); st = true; } ctx.stroke(); }); ctx.restore(); text('- - dipolo: μ₀NIR²/(2|z|³)', pl.x + 16, pl.y + pl.h - 16, COL.accent, 11); }
    ctx.save(); ctx.strokeStyle = COL.field; ctx.lineWidth = 2.5; ctx.beginPath(); for (let i = 0; i <= 200; i++) { const z = z0 + i * (z1 - z0) / 200; i ? ctx.lineTo(X(z), Y(eAxis(z))) : ctx.moveTo(X(z), Y(eAxis(z))); } ctx.stroke(); ctx.restore();
    text(`centro: ${sp(eAxis(0))} T`, X(0) + 8, Y(eAxis(0)) - 10, COL.field, 11);
    if (E.z >= z0 && E.z <= z1) { ctx.fillStyle = COL.primary; ctx.beginPath(); ctx.arc(X(E.z), Y(B), 6, 0, 2 * Math.PI); ctx.fill(); if (app.checked) text(`P: ${sp(B)} T`, X(E.z) + 10, Y(B) + 16, COL.primary, 11, 'left', 600); }
    [z0, -E.R, 0, E.R, z1].forEach(z => text(fp(z * 100, 0), X(z), Y(0) + 14, COL.muted, 11, 'center'));
    text('z (cm)', X(0), Y(0) + 32, COL.muted, 11, 'center');
  },
};

// ───────────────────────── orquestación ─────────────────────────
const SC = { oersted: scOersted, segmento: scSegmento, hilos: scHilos, espira: scEspira };
const sc = () => SC[app.scene];

function draw() {
  if (!W) return;
  readColors();
  ctx.clearRect(0, 0, W, H);
  sc().draw();
  $('#coords-indicator').textContent = sc().coords();
  renderLive();
}
let liveKey = '';
function renderLive() { const t = sc().live(); if (t !== liveKey) { liveKey = t; $('#live-tex').innerHTML = K(t); } }

function buildToolbar() { $('#toolbar').innerHTML = sc().tools(); draw(); }
function buildValues() {
  const box = $('#values-body'), vals = sc().values();
  box.innerHTML = vals.map((v, i) => `<label class="vrange" title="${v.label || ''}"><span class="sym">${v.sym}${v.sub ? `<sub style="font-style:normal;font-size:.7em">${v.sub}</sub>` : ''}</span><input type="range" min="${v.min}" max="${v.max}" step="${v.step}" value="${v.get()}" data-i="${i}" aria-label="${v.label || v.sym}"><output>${v.fmt(v.get())}</output></label>`).join('') + (sc().valuesNote ? `<div class="vnote">${sc().valuesNote}</div>` : '');
  box.querySelectorAll('input').forEach(inp => inp.addEventListener('input', () => {
    const v = vals[+inp.dataset.i]; v.set(parseFloat(inp.value)); inp.nextElementSibling.textContent = v.fmt(v.get()); invalidate(); draw(); renderPanel(false);
  }));
}
function renderReto() {
  mixed($('#reto-text'), sc().retoText());
  $('#reto-tag').textContent = sc().retoTag;
  const ch = $('#pred-choices'); ch.innerHTML = sc().choices.map(c => `<button class="btn ${pred.choice === c.id ? 'on' : ''}" data-choice="${c.id}" type="button">${c.label}</button>`).join('');
  mixed($('#pred-q'), sc().predQ);
  mixed($('#ans-label'), sc().ansLabel);
  $('#ans-val').placeholder = sc().ansPh;
}
function renderPanel(full = true) {
  const s = sc(), hasP = s.hasPred();
  $('#reto-note').textContent = s.changed() ? 'Cambiaste el montaje del reto: se comprueba con lo que ves en el lienzo.' : '';
  if (full) $('#pred-choices').querySelectorAll('[data-choice]').forEach(b => b.classList.toggle('on', b.dataset.choice === pred.choice));
  $('#pred-hint').textContent = s.predHint ? s.predHint() : '';
  $('#st2').dataset.s = hasP ? 'done' : 'now';
  $('#st3').dataset.s = app.checked ? 'done' : hasP ? 'now' : 'todo';
  $('#st4').dataset.s = app.checked ? (app.result?.allOk ? 'done' : 'now') : 'todo';
  const box = $('#validation-box');
  if (app.checked && app.result) {
    box.innerHTML = app.result.rows.map(r => `<div class="vrow"><span>${r.t}</span><span class="e10-chip ${r.ok === true ? 'e10-chip--ok' : r.ok === false ? 'e10-chip--bad' : 'e10-chip--warn'}">${r.chip}</span></div>`).join('');
    if (window.renderMathInElement) renderMathInElement(box, { delimiters: [{ left: '\\(', right: '\\)', display: false }], throwOnError: false });
    mixed($('#explain'), `<div class="e10-tip__title">${app.result.allOk ? 'Muy bien' : 'Recomendación'}</div>${app.result.tip}`);
  } else { box.innerHTML = ''; $('#explain').innerHTML = ''; }
  $('#btn-sol').hidden = !app.checked;
  const sol = $('#solution'); sol.hidden = !(app.checked && app.showSol);
  if (!sol.hidden) mixed(sol, s.solution());
  const n = 1 + (hasP ? 1 : 0) + (app.checked ? 1 : 0) + (app.result?.allOk ? 1 : 0);
  $('#prog').style.setProperty('--e10-p', n * 25 + '%'); $('#prog-bar').setAttribute('aria-valuenow', n * 25); $('#prog-txt').textContent = `${n} de 4`;
}
function newReto() { sc().newReto(); resetPred(); buildToolbar(); buildValues(); renderReto(); renderPanel(); draw(); }
const seen = {};
function setScene(id, push = true) {
  if (!SC[id]) id = 'hilos';
  app.scene = id;
  document.querySelectorAll('.scene-tabs [data-scene]').forEach(b => b.setAttribute('aria-selected', b.dataset.scene === id));
  if (!seen[id]) { seen[id] = true; sc().newReto(); }
  $('#values').open = window.innerWidth > 900;
  resetPred(); buildToolbar(); buildValues(); renderReto(); renderPanel(); liveKey = ''; draw();
  if (push && location.hash !== '#' + id) history.replaceState(null, '', '#' + id);
  cv.style.cursor = id === 'oersted' ? 'default' : 'crosshair';
}

// ───────────────────────── eventos ─────────────────────────
$('#toolbar').addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b) { sc().act(b.dataset.act); renderPanel(false); } });
document.querySelectorAll('.scene-tabs [data-scene]').forEach(b => b.addEventListener('click', () => setScene(b.dataset.scene)));
$('#pred-choices').addEventListener('click', e => {
  const b = e.target.closest('[data-choice]'); if (!b) return;
  pred.choice = b.dataset.choice; if (app.scene === 'hilos' && pred.choice === 'cero') pred.angle = null;
  if (app.scene === 'hilos' && pred.choice === 'nocero' && pred.angle === null) { Hs.tool = 'pred'; buildToolbar(); }
  app.checked = false; app.result = null; app.showSol = false; renderPanel(); draw();
});
$('#btn-check').addEventListener('click', () => {
  if (!sc().hasPred()) { $('#check-hint').textContent = 'Primero haz tu predicción en el paso 2.'; return; }
  $('#check-hint').textContent = '';
  app.result = sc().check(); app.checked = true; app.showSol = false;
  if (app.scene === 'hilos') { Hs.show.parts = true; Hs.show.needles = true; buildToolbar(); }
  renderPanel(); liveKey = ''; draw();
  if (window.innerWidth <= 900) $('#right-panel').classList.add('open');
});
$('#ans-val').addEventListener('keydown', e => { if (e.key === 'Enter') $('#btn-check').click(); });
$('#btn-sol').addEventListener('click', () => { app.showSol = !app.showSol; renderPanel(false); });
$('#btn-new').addEventListener('click', newReto);
$('#sheet-handle').addEventListener('click', () => $('#right-panel').classList.toggle('open'));
$('#btn-projector').addEventListener('click', () => { document.body.classList.toggle('e10-projector'); $('#btn-projector').classList.toggle('active'); draw(); });
$('#btn-theme').addEventListener('click', () => { lab10Auth.toggleTheme(); try { localStorage.setItem('electro10_theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light'); } catch (_) {} });
new MutationObserver(() => { const i = $('#btn-theme i'); if (i) i.className = document.body.classList.contains('dark-mode') ? 'ph ph-sun' : 'ph ph-moon'; draw(); }).observe(document.body, { attributes: true, attributeFilter: ['class'] });
$('#user-info').addEventListener('click', () => { if (!lab10Auth.isAuthenticated) lab10Auth.loginGoogle(); });
lab10Auth.onAuthChange((ok, user) => { $('#user-info').textContent = ok ? (user?.displayName || 'Estudiante') : 'Iniciar sesión'; });

const pos = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
cv.addEventListener('pointerdown', e => { if (!sc().down) return; cv.setPointerCapture(e.pointerId); sc().down(...pos(e)); draw(); });
cv.addEventListener('pointermove', e => { if (!sc().move) return; sc().move(...pos(e)); if (e.buttons) draw(); });
cv.addEventListener('pointerup', e => { if (sc().up) sc().up(...pos(e)); draw(); });
cv.addEventListener('pointercancel', () => { if (sc().up) sc().up(); });
window.addEventListener('hashchange', () => { const id = location.hash.slice(1); if (SC[id] && id !== app.scene) setScene(id, false); });

// ───────────────────────── Lab10 Bus ─────────────────────────
lab10Bus.injectContinueButton($('#continue-wrap'), 'Sim_M9_Solenoide.html', 'Solenoide (capítulo 10)', () => ({
  source: 'BiotSavartLab10', units: { length: 'm', current: 'A' },
  entities: { wires: Hs.wires.map((w, i) => ({ id: i + 1, x: w.x, y: w.y, I: w.I })), loop: { R: E.R, I: E.I, N: E.mode === 'bobina' ? E.N : 1 } },
  metrics: { B_P: Math.hypot(...hField(Hs.P.x, Hs.P.y)) }, timestamp: Date.now(),
}));
lab10Bus.checkIncomingScenario(data => {
  const ws = data?.entities?.wires;
  if (Array.isArray(ws) && ws.length) { Hs.wires = ws.filter(w => isFinite(w.x) && isFinite(w.y) && isFinite(w.I)).map(w => ({ x: +w.x, y: +w.y, I: +w.I })); Hs.cacheKey = ''; seen.hilos = true; Hs.reto = Hs.reto || { t: 'dos', d: 0.08, I1: 10, I2: 10, same: true }; setScene('hilos'); }
});

// ───────────────────────── arranque ─────────────────────────
new ResizeObserver(resize).observe(area);
setScene((location.hash || '#hilos').slice(1), false);
window.__bsl = { app, O, G, Hs, E, oPhys, segB, hField, eAxis, eArc, setScene };
</script>
