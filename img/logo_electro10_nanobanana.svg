<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 340" width="100%" height="100%" class="electro10-logo" role="img" aria-label="Logo Oficial Electro10.Easy con Nano Banana">
  <defs>
    <!-- Gradientes de neón electromagnético -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b192c" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#08101e" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="magentaNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a85"/>
      <stop offset="100%" stop-color="#b3246b"/>
    </linearGradient>
    <linearGradient id="bananaSkin" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#facc15"/>
      <stop offset="90%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="visorGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <!-- Filtro de resplandor Neón -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Escudo Heráldico de Fondo -->
  <path d="M 160,22 C 235,22 265,36 265,36 C 265,130 240,215 160,256 C 80,215 55,130 55,36 C 55,36 85,22 160,22 Z"
        fill="url(#shieldGrad)" stroke="url(#goldBorder)" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 160,30 C 225,30 252,42 252,42 C 252,122 230,198 160,238 C 90,198 68,122 68,42 C 68,42 95,30 160,30 Z"
        fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="6,4"/>

  <!-- Anillos Electromagnéticos: Órbita Magenta y Bucle 10 -->
  <g filter="url(#neonGlow)">
    <!-- Líneas de campo magnético envolventes (Elipses en perspectiva) -->
    <ellipse cx="160" cy="142" rx="115" ry="32" fill="none" stroke="url(#magentaNeon)" stroke-width="3" opacity="0.85" transform="rotate(-12, 160, 142)"/>
    <ellipse cx="160" cy="142" rx="100" ry="26" fill="none" stroke="url(#cyanNeon)" stroke-width="2.5" opacity="0.9" transform="rotate(-12, 160, 142)"/>
    <ellipse cx="160" cy="142" rx="85" ry="20" fill="none" stroke="url(#magentaNeon)" stroke-width="2" opacity="0.75" transform="rotate(-12, 160, 142)"/>
    
    <!-- Flechas de circulación del campo magnético B en las órbitas -->
    <polygon points="68,162 76,155 77,166" fill="#00f0ff"/>
    <polygon points="252,120 244,113 243,124" fill="#ff2a85"/>
  </g>

  <!-- Numeral "1" de neón detrás de la banana -->
  <path d="M 96,110 L 115,82 L 126,82 L 126,175 M 106,175 L 140,175"
        fill="none" stroke="url(#cyanNeon)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.75" filter="url(#neonGlow)"/>

  <!-- Numeral "0" / Bucle infinito en magenta a la derecha -->
  <ellipse cx="218" cy="128" rx="28" ry="44" fill="none" stroke="url(#magentaNeon)" stroke-width="5" opacity="0.8" filter="url(#neonGlow)"/>

  <!-- Nano Banana (Mascota Pedagógica Central) -->
  <!-- Cuerpo curvado de la banana -->
  <path d="M 172,54 C 182,75 190,105 186,145 C 182,185 160,215 132,228 C 128,230 124,226 126,222 C 142,192 148,155 146,115 C 144,82 165,58 172,54 Z"
        fill="url(#bananaSkin)" stroke="#854d0e" stroke-width="2.5" stroke-linejoin="round"/>
  
  <!-- Tallo superior y punta inferior -->
  <path d="M 172,54 C 174,45 178,42 181,40 C 183,43 181,49 177,53 Z" fill="#65a30d" stroke="#3f6212" stroke-width="1.5"/>
  <circle cx="127" cy="225" r="3.5" fill="#713f12"/>

  <!-- Gafas Cyber Visor de Nano Banana -->
  <g filter="url(#neonGlow)">
    <rect x="138" y="98" width="54" height="22" rx="7" fill="#0f172a" stroke="#00f0ff" stroke-width="2.5"/>
    <rect x="142" y="102" width="20" height="14" rx="4" fill="url(#visorGlass)" stroke="#38bdf8" stroke-width="1"/>
    <rect x="168" y="102" width="20" height="14" rx="4" fill="url(#visorGlass)" stroke="#38bdf8" stroke-width="1"/>
    <!-- Pupilas / Luces LED inteligentes -->
    <circle cx="152" cy="109" r="3" fill="#ffffff"/>
    <circle cx="178" cy="109" r="3" fill="#ffffff"/>
    <circle cx="154" cy="107" r="1.2" fill="#00f0ff"/>
    <circle cx="180" cy="107" r="1.2" fill="#00f0ff"/>
    <!-- Patillas del visor -->
    <line x1="138" y1="109" x2="134" y2="110" stroke="#00f0ff" stroke-width="2"/>
    <line x1="192" y1="109" x2="195" y2="110" stroke="#00f0ff" stroke-width="2"/>
  </g>

  <!-- Sonrisa alegre -->
  <path d="M 158,127 Q 166,134 174,127" fill="none" stroke="#713f12" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Pajarita / Corbatín azul de profesor -->
  <polygon points="158,136 150,131 150,143 158,138" fill="#0284c7" stroke="#0369a1" stroke-width="1"/>
  <polygon points="166,136 174,131 174,143 166,138" fill="#0284c7" stroke="#0369a1" stroke-width="1"/>
  <circle cx="162" cy="137" r="2.8" fill="#38bdf8"/>

  <!-- Brazo y lápiz puntero electromagnético -->
  <!-- Brazo izquierdo sosteniendo el puntero -->
  <path d="M 148,136 Q 130,138 126,148" fill="none" stroke="#ca8a04" stroke-width="4" stroke-linecap="round"/>
  <!-- Puntero cuántico neón -->
  <line x1="124" y1="134" x2="128" y2="158" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" filter="url(#neonGlow)"/>
  <polygon points="124,132 121,137 127,137" fill="#ffffff"/>
  <!-- Brazo derecho en pose de saludo -->
  <path d="M 178,142 Q 192,148 195,160" fill="none" stroke="#ca8a04" stroke-width="4" stroke-linecap="round"/>

  <!-- Texto Tipográfico: ELECTRO10 · EASY -->
  <g id="logoText" text-anchor="middle">
    <!-- ELECTRO 10 -->
    <text x="160" y="294" font-family="'Inter', 'Montserrat', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="28" letter-spacing="2">
      <tspan fill="#00f0ff" filter="url(#neonGlow)">ELECTRO</tspan><tspan fill="#ff2a85" filter="url(#neonGlow)">10</tspan>
    </text>
    
    <!-- Líneas divisorias y EASY -->
    <line x1="72" y1="312" x2="118" y2="312" stroke="url(#goldBorder)" stroke-width="2" stroke-linecap="round"/>
    <text x="160" y="318" font-family="'Inter', 'Montserrat', 'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="14" fill="#ffffff" letter-spacing="6">EASY</text>
    <line x1="202" y1="312" x2="248" y2="312" stroke="url(#goldBorder)" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Subtítulo institucional -->
    <text x="160" y="332" font-family="'Inter', 'Montserrat', system-ui, sans-serif" font-weight="600" font-size="9" fill="#94a3b8" letter-spacing="1.5">FÍSICA UNIVERSITARIA · UNAB</text>
  </g>
</svg>
