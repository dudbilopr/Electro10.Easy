<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%" class="electro10-logo" role="img" aria-label="Logo Oficial Electro10.Easy · Electromagnetismo · Dudbil Olvasada Pabón Riaño">
  <defs>
    <!-- Gradientes de Neón y Físico-Matemáticos -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040d1a"/>
      <stop offset="45%" stop-color="#071527"/>
      <stop offset="100%" stop-color="#020710"/>
    </linearGradient>

    <!-- Borde Institucional Dorado / Ambar Tecnológico -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="30%" stop-color="#0284c7"/>
      <stop offset="70%" stop-color="#b3246b"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Gradiente Campo Eléctrico E (Magenta - Fucsia Dinámico) -->
    <linearGradient id="fieldE" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3388"/>
      <stop offset="100%" stop-color="#b3246b"/>
    </linearGradient>

    <!-- Gradiente Campo Magnético B (Cyan - Azul Fotónico) -->
    <linearGradient id="fieldB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Resplandor del Núcleo Central -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="25%" stop-color="#00f5ff" stop-opacity="0.8"/>
      <stop offset="65%" stop-color="#b3246b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0b192c" stop-opacity="0"/>
    </radialGradient>

    <!-- Filtro Glow de Neón Electromagnético -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Escudo Heráldico Institucional de Protección y Rigor Académico -->
  <path d="M 160,18 C 242,18 274,32 274,32 C 274,136 248,226 160,270 C 72,226 46,136 46,32 C 46,32 78,18 160,18 Z"
        fill="url(#shieldGrad)" stroke="url(#goldBorder)" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- Trazado de malla interna de potencial electrostático -->
  <path d="M 160,26 C 234,26 262,38 262,38 C 262,128 238,212 160,252 C 82,212 58,128 58,38 C 58,38 86,26 160,26 Z"
        fill="none" stroke="#00f5ff" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="5,4"/>

  <!-- LÍNEAS DE CAMPO MAGNÉTICO B Y VÓRTICES (Rotor y Ley de Faraday / Biot-Savart) -->
  <g filter="url(#glow)">
    <!-- Elipse orbital 1 (Inclinada -30°): Campo B toroidal -->
    <ellipse cx="160" cy="140" rx="108" ry="34" fill="none" stroke="url(#fieldB)" stroke-width="2.6" opacity="0.85" transform="rotate(-28, 160, 140)"/>
    <!-- Flechas de circulación del campo magnético B (Regla de la mano derecha) -->
    <polygon points="76,178 86,170 85,182" fill="#00f5ff"/>
    <polygon points="244,102 234,110 235,98" fill="#00f5ff"/>

    <!-- Elipse orbital 2 (Inclinada +28°): Vector E / Desplazamiento Maxwell -->
    <ellipse cx="160" cy="140" rx="108" ry="34" fill="none" stroke="url(#fieldE)" stroke-width="2.6" opacity="0.85" transform="rotate(28, 160, 140)"/>
    <polygon points="244,178 234,170 235,182" fill="#ff3388"/>
    <polygon points="76,102 86,110 85,98" fill="#ff3388"/>

    <!-- Anillo ecuatorial circular horizontal -->
    <ellipse cx="160" cy="140" rx="88" ry="18" fill="none" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="7,5" opacity="0.8"/>
  </g>

  <!-- NÚCLEO ELECTROMAGNÉTICO: Resplandor cuántico central -->
  <circle cx="160" cy="140" r="44" fill="url(#coreGlow)"/>

  <!-- MONOGRAMA CENTRAL VECTORIAL "10" (Identidad del Curso: Electro 10.Easy) -->
  <g filter="url(#strongGlow)">
    <!-- DÍGITO "1" (Estilizado como vector gradiente o conductor lineal con corriente) -->
    <path d="M 122,108 L 138,94 L 146,94 L 146,182 M 128,182 L 158,182"
          fill="none" stroke="#00f5ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- DÍGITO "0" / ESPIRA CERRADA (Representación de la integral de línea de Biot-Savart / Ampère ∮ B·dl) -->
    <ellipse cx="186" cy="138" rx="22" ry="44" fill="none" stroke="#ff3388" stroke-width="7.5" stroke-linecap="round"/>
    <!-- Eje central del dipolo magnético dentro del "0" -->
    <line x1="186" y1="102" x2="186" y2="174" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="3,3"/>
    <!-- Flecha del momento dipolar magnético m -->
    <polygon points="186,96 182,104 190,104" fill="#ffffff"/>
  </g>

  <!-- SÍMBOLOS VECTORIALES DE FÍSICA TEÓRICA Y EXPERIMENTAL (Burbano & Sears-Zemansky) -->
  <!-- Vector Campo Eléctrico E -->
  <g opacity="0.95">
    <text x="68" y="74" font-family="'STIX Two Text', 'Times New Roman', serif" font-size="15" font-weight="bold" font-style="italic" fill="#ff3388">E</text>
    <line x1="68" y1="62" x2="80" y2="62" stroke="#ff3388" stroke-width="1.4"/>
    <polygon points="82,62 78,59 78,65" fill="#ff3388"/>
  </g>

  <!-- Vector Campo Magnético B -->
  <g opacity="0.95">
    <text x="238" y="74" font-family="'STIX Two Text', 'Times New Roman', serif" font-size="15" font-weight="bold" font-style="italic" fill="#00f5ff">B</text>
    <line x1="238" y1="62" x2="250" y2="62" stroke="#00f5ff" stroke-width="1.4"/>
    <polygon points="252,62 248,59 248,65" fill="#00f5ff"/>
  </g>

  <!-- Símbolo del Producto Vectorial dℓ × r̂ -->
  <circle cx="160" cy="80" r="11" fill="#040d1a" stroke="#f59e0b" stroke-width="1.8"/>
  <line x1="154" y1="74" x2="166" y2="86" stroke="#f59e0b" stroke-width="2"/>
  <line x1="166" y1="74" x2="154" y2="86" stroke="#f59e0b" stroke-width="2"/>
  <!-- Vector unitario normal n_hat -->
  <circle cx="160" cy="80" r="2.5" fill="#f59e0b"/>

  <!-- Cintas y Tipografía Inferior Institucional: ELECTRO10.EASY -->
  <g transform="translate(0, 5)">
    <!-- Base de la cinta -->
    <path d="M 52,228 L 160,246 L 268,228 L 262,256 L 160,276 L 58,256 Z"
          fill="#061324" stroke="url(#goldBorder)" stroke-width="2" stroke-linejoin="round"/>
    
    <!-- Texto Principal -->
    <text x="160" y="247" text-anchor="middle" font-family="'Outfit', 'IBM Plex Sans', sans-serif" font-weight="900" font-size="16" letter-spacing="0.12em" fill="#ffffff">
      ELECTRO<tspan fill="#ff3388">10</tspan><tspan fill="#00f5ff">.EASY</tspan>
    </text>

    <!-- Subtítulo Institucional y de Autor -->
    <text x="160" y="266" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-weight="600" font-size="8" letter-spacing="0.14em" fill="#94a3b8">
      ELECTROMAGNETISMO · PROF. DUDBIL PABÓN
    </text>
  </g>

  <!-- Puntos de Conexión de Carga Positiva (+) y Negativa (-) -->
  <circle cx="82" cy="140" r="6" fill="#ff3388" stroke="#ffffff" stroke-width="1.2"/>
  <line x1="79" y1="140" x2="85" y2="140" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="82" y1="137" x2="82" y2="143" stroke="#ffffff" stroke-width="1.5"/>

  <circle cx="238" cy="140" r="6" fill="#0284c7" stroke="#ffffff" stroke-width="1.2"/>
  <line x1="235" y1="140" x2="241" y2="140" stroke="#ffffff" stroke-width="1.5"/>
</svg>
